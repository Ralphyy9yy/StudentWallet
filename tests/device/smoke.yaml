appId: com.studentwallet.app
---
# Use ONLY an isolated test install: clearState deletes its previous wallet.
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Allowance amount (PHP)"
- tapOn: "Allowance amount (PHP)"
- inputText: "1500.00"
- hideKeyboard
- scrollUntilVisible:
    element: "Create allowance"
- tapOn: "Create allowance"
- assertVisible: "Make today work."
- scrollUntilVisible:
    element: "Add expense"
- tapOn: "Add expense"
- tapOn: "Amount (PHP)"
- inputText: "50.00"
- hideKeyboard
- scrollUntilVisible:
    element: "Save transaction"
- tapOn: "Save transaction"
- assertVisible: "Make today work."
- stopApp
- launchApp
- assertVisible: "Make today work."
- tapOn: "Transactions"
- tapOn: "Filters"
- assertVisible: "Expenses"
